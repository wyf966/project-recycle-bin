function shortPath(p) {
  if (!p) return '';
  const parts = p.split('\\').filter(Boolean);
  if (parts.length <= 2) return p;
  return parts[0] + '\\…\\' + parts[parts.length - 1];
}

// ==================== FILTER, SORT, GROUP PIPELINE ====================
function updateResults(resetScroll) {
  activeQuery = parseSearchQuery($('search').value);
  $('searchClear').hidden = !$('search').value;

  const nowTicks = 621355968000000000 + Date.now() * 10000;
  const periodTicks = Math.abs(state.period) * 86400000 * 10000;
  const groupBy = state.groupBy;
  const dupView = state.smartView === 'duplicates' || groupBy === 'duplicates';

  const filtered = [];
  let sumBytes = 0;
  maxResultBytes = 1;

  for (let i = 0; i < all.length; i++) {
    const it = all[i];
    if (state.smartView === 'duplicates' && it.duplicates <= 1) continue;
    if (state.smartView === 'large' && it.bytes < 10 * 1048576) continue;
    if (state.smartView === 'cache' && it.category !== '缓存与临时文件' && it.category !== '日志') continue;
    if (state.smartView === 'keep' && marks[it.path] !== '保留') continue;
    if (state.smartView === 'review' && marks[it.path] !== '待复核') continue;
    if (state.smartView === 'purge' && marks[it.path] !== '待清理') continue;

    if (dupView && it.duplicates <= 1) continue;
    if (state.drive && it.drive !== state.drive) continue;
    if (state.category && it.category !== state.category) continue;
    if (state.project && it.project !== state.project) continue;
    if (state.batch && it.batch !== state.batch) continue;
    if (state.period > 0 && it.deletedTs < nowTicks - periodTicks) continue;
    if (state.period < 0 && it.deletedTs >= nowTicks - periodTicks) continue;
    if (activeQuery.active && !matchesSearchQuery(it, activeQuery)) continue;

    filtered.push(it);
    sumBytes += it.bytes;
    if (it.bytes > maxResultBytes) maxResultBytes = it.bytes;
  }

  // Fast sorting
  const dir = state.sortDir === 'asc' ? 1 : -1;
  const sortBy = state.sortBy;
  filtered.sort((a, b) => {
    let cmp = 0;
    if (sortBy === 'bytes') cmp = a.bytes - b.bytes;
    else if (sortBy === 'deletedTs') cmp = a.deletedTs - b.deletedTs;
    else if (sortBy === 'duplicates') cmp = a.duplicates - b.duplicates;
    else if (sortBy === 'ext') cmp = a.ext < b.ext ? -1 : a.ext > b.ext ? 1 : 0;
    else if (sortBy === 'name') cmp = collator.compare(a._nameLower, b._nameLower);
    if (cmp !== 0) return cmp * dir;
    return b.deletedTs - a.deletedTs || (a.path < b.path ? -1 : 1);
  });

  results = filtered;
  resultIndexByPath = new Map();
  for (let i = 0; i < results.length; i++) resultIndexByPath.set(results[i].path, i);

  // Build entries (grouped or flat)
  if (state.viewMode === 'grid' || groupBy === 'flat') {
    entries = results.map(item => ({ type: 'item', item }));
    $('toggleCollapseBtn').hidden = true;
  } else {
    $('toggleCollapseBtn').hidden = false;
    const groups = new Map();
    for (let i = 0; i < results.length; i++) {
      const it = results[i];
      const key = groupBy === 'duplicates' ? it.hash
        : groupBy === 'project' ? it.project
        : groupBy === 'category' ? it.category
        : it.batch;
      let g = groups.get(key);
      if (!g) {
        g = { key, files: [], bytes: 0, minTs: it.deletedTs, maxTs: it.deletedTs };
        groups.set(key, g);
      }
      g.files.push(it);
      g.bytes += it.bytes;
      if (it.deletedTs < g.minTs) g.minTs = it.deletedTs;
      if (it.deletedTs > g.maxTs) g.maxTs = it.deletedTs;
    }

    const groupList = [...groups.values()];
    if (sortBy === 'bytes') groupList.sort((a, b) => (a.bytes - b.bytes) * dir);
    else if (sortBy === 'deletedTs') groupList.sort((a, b) => (a.maxTs - b.maxTs) * dir);

    entries = [];
    for (let i = 0; i < groupList.length; i++) {
      const g = groupList[i];
      // Avoid noisy 1-item batch headers: render singleton batch items directly with directory in subline
      if (groupBy === 'batch' && g.files.length === 1) {
        entries.push({ type: 'item', item: g.files[0], inHeaderGroup: false });
        continue;
      }
      const title = groupBy === 'duplicates' ? '相同内容副本 (' + g.files[0].name + ')'
        : groupBy === 'batch' ? g.files[0].directory
        : g.key;
      const subtitle = groupBy === 'duplicates' ? 'SHA-256 ' + g.key.slice(0, 14) + '…'
        : groupBy === 'batch' ? fmtDate(g.minTs, false) + (g.minTs !== g.maxTs ? ' ~ ' + fmtDate(g.maxTs, false) : '')
        : g.files.length + ' 个文件';
      const collapsed = collapsedGroups.has(g.key);
      entries.push({
        type: 'group', key: g.key, title, subtitle,
        count: g.files.length, bytes: g.bytes, files: g.files, collapsed
      });
      if (!collapsed) {
        for (let j = 0; j < g.files.length; j++) entries.push({ type: 'item', item: g.files[j], inHeaderGroup: groupBy === 'batch' || groupBy === 'project' });
      }
    }
  }

  $('resultSummary').innerHTML = '<strong>' + results.length.toLocaleString() + '</strong> 项 · <span class="mono">' + formatBytes(sumBytes) + '</span>';
  renderActiveChips();
  updateSelectionUI();
  resetVirtualViewport(resetScroll);
}

function renderActiveChips() {
  const chips = [];
  if (state.smartView !== 'all') {
    const map = { duplicates: '重复内容', large: '大文件 >10MB', cache: '缓存与日志', keep: '已保留', review: '待复核', purge: '待清理' };
    chips.push({ label: '视图: ' + map[state.smartView], clear: () => { state.smartView = 'all'; } });
  }
  if (state.drive) chips.push({ label: '盘符: ' + state.drive, clear: () => { state.drive = ''; } });
  if (state.period) chips.push({ label: '时间: ' + (state.period > 0 ? '近 ' + state.period + ' 天' : '30天以前'), clear: () => { state.period = 0; syncPeriodPills(); } });
  if (state.category) chips.push({ label: '类别: ' + state.category, clear: () => { state.category = ''; } });
  if (state.project) chips.push({ label: '目录: ' + shortPath(state.project), clear: () => { state.project = ''; } });
  if (state.batch) chips.push({ label: '指定删除批次', clear: () => { state.batch = ''; } });
  if ($('search').value.trim()) chips.push({ label: '搜索: ' + $('search').value.trim(), clear: () => { $('search').value = ''; } });

  const box = $('activeChips');
  box.hidden = chips.length === 0;
  if (!chips.length) return;

  const frag = document.createDocumentFragment();
  for (const ch of chips) {
    const el = document.createElement('span');
    el.className = 'chip';
    el.textContent = ch.label;
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '×';
    x.onclick = () => { ch.clear(); renderFacets(); updateResults(true); };
    el.appendChild(x);
    frag.appendChild(el);
  }
  const reset = document.createElement('button');
  reset.type = 'button'; reset.className = 'sm ghost'; reset.textContent = '重置全部';
  reset.onclick = resetAllFilters;
  frag.appendChild(reset);
  box.replaceChildren(frag);
}

function resetAllFilters() {
  state.smartView = 'all';
  state.drive = '';
  state.period = 0;
  state.category = '';
  state.project = '';
  state.batch = '';
  $('search').value = '';
  syncPeriodPills();
  renderFacets();
  updateResults(true);
}

// ==================== HIGH-PERF VIRTUAL VIEWPORT (DOM ROW POOL) ====================
function getVirtualMetrics() {
  if (state.viewMode === 'grid') {
    const w = Math.max(300, viewport.clientWidth - 24);
    gridCols = Math.max(2, Math.floor((w + 10) / 168));
    rowHeight = 178;
    const totalRows = Math.ceil(results.length / gridCols);
    return { totalRows, rowHeight };
  }
  rowHeight = state.viewMode === 'compact' ? 30 : 44;
  return { totalRows: entries.length, rowHeight };
}

function resetVirtualViewport(resetScroll) {
  const emptyEl = viewport.querySelector('.empty-state');
  if (!results.length) {
    spacer.style.height = '0px';
    rowPoolEl.replaceChildren();
    poolNodes = [];
    if (!emptyEl) {
      const em = document.createElement('div');
      em.className = 'empty-state';
      em.innerHTML = '<strong>' + (hasScanned ? (all.length ? '没有符合当前条件的文件' : '回收站为空') : '正在扫描回收站…') + '</strong>'
        + '<span>' + (all.length ? '可尝试放宽搜索或点击上方“重置全部”' : '当前用户回收站中暂无待处理项目') + '</span>';
      viewport.appendChild(em);
    }
    return;
  }
  if (emptyEl) emptyEl.remove();

  const { totalRows, rowHeight: rh } = getVirtualMetrics();
  const virtualH = Math.min(totalRows * rh, MAX_VIRTUAL_PX);
  spacer.style.height = virtualH + 'px';
  if (resetScroll) viewport.scrollTop = 0;
  renderedKey = '';
  ensurePoolSize();
  renderVirtualWindow();
}

function ensurePoolSize() {
  const visibleRows = Math.ceil((viewport.clientHeight || 600) / rowHeight) + 12;
  const need = Math.max(16, visibleRows);
  const mode = state.viewMode;

  if (poolNodes.length && poolNodes[0]._mode !== mode) {
    rowPoolEl.replaceChildren();
    poolNodes = [];
  }

  const frag = document.createDocumentFragment();
  while (poolNodes.length < need) {
    const slot = document.createElement('div');
    slot.className = 'v-slot';
    slot._mode = mode;
    slot.style.display = 'none';
    if (mode === 'grid') {
      slot.classList.add('grid-row-slot');
    } else {
      slot.innerHTML =
        '<div class="v-group" style="display:none">'
        + '<div class="v-group-left">'
        + '<input type="checkbox" class="grp-chk" aria-label="勾选整组">'
        + '<svg class="ic sm v-group-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
        + '<span class="v-group-title"></span><span class="v-group-sub"></span>'
        + '</div><div class="v-group-right mono"></div>'
        + '</div>'
        + '<div class="v-row" style="display:none">'
        + '<input type="checkbox" class="row-chk">'
        + '<span class="ext-pill"></span>'
        + '<div class="v-row-main"><div class="v-row-name-line"><span class="v-row-name"></span><span class="v-row-tags"></span></div><div class="v-row-sub"></div></div>'
        + '<span class="v-row-compact-date mono"></span>'
        + '<div class="v-row-size"><span class="v-row-size-txt mono"></span><div class="size-bar-track"><div class="size-bar-fill"></div></div></div>'
        + '</div>';
      slot._grp = slot.children[0];
      slot._grpChk = slot._grp.querySelector('.grp-chk');
      slot._grpTitle = slot._grp.querySelector('.v-group-title');
      slot._grpSub = slot._grp.querySelector('.v-group-sub');
      slot._grpRight = slot._grp.querySelector('.v-group-right');

      slot._row = slot.children[1];
      slot._chk = slot._row.querySelector('.row-chk');
      slot._ext = slot._row.querySelector('.ext-pill');
      slot._name = slot._row.querySelector('.v-row-name');
      slot._tags = slot._row.querySelector('.v-row-tags');
      slot._sub = slot._row.querySelector('.v-row-sub');
      slot._cdate = slot._row.querySelector('.v-row-compact-date');
      slot._sz = slot._row.querySelector('.v-row-size-txt');
      slot._bar = slot._row.querySelector('.size-bar-fill');
    }
    poolNodes.push(slot);
    frag.appendChild(slot);
  }
  if (frag.childNodes.length) rowPoolEl.appendChild(frag);
}

function renderVirtualWindow() {
  if (!results.length) return;
  const { totalRows, rowHeight: rh } = getVirtualMetrics();
  const maxScroll = Math.max(1, spacer.offsetHeight - viewport.clientHeight);
  const realTotalH = totalRows * rh;
  const scrollRatio = realTotalH > MAX_VIRTUAL_PX ? (viewport.scrollTop / maxScroll) : null;
  const virtualTop = scrollRatio !== null ? scrollRatio * Math.max(0, realTotalH - viewport.clientHeight) : viewport.scrollTop;

  const startRow = Math.max(0, Math.floor(virtualTop / rh) - 4);
  const visibleCount = Math.ceil(viewport.clientHeight / rh) + 10;
  const endRow = Math.min(totalRows, startRow + visibleCount);

  ensurePoolSize();
  const key = state.viewMode + ':' + startRow + ':' + endRow + ':' + gridCols + ':' + current + ':' + selected.size;
  // Always update positions if compressed scroll
  if (key === renderedKey && scrollRatio === null) return;
  renderedKey = key;

  const offsetAdjust = scrollRatio !== null ? (viewport.scrollTop - virtualTop) : 0;
  const visibleGridPaths = [];

  for (let i = 0; i < poolNodes.length; i++) {
    const slot = poolNodes[i];
    const rowIdx = startRow + i;
    if (rowIdx >= endRow) {
      slot.style.display = 'none';
      continue;
    }
    slot.style.display = '';
    slot.style.height = rh + 'px';
    slot.style.transform = 'translate3d(0,' + Math.round(rowIdx * rh + offsetAdjust) + 'px,0)';

    if (state.viewMode === 'grid') {
      renderGridRowSlot(slot, rowIdx, visibleGridPaths);
    } else {
      patchListSlot(slot, entries[rowIdx]);
    }
  }

  if (state.viewMode === 'grid' && visibleGridPaths.length) {
    scheduleThumbFetch(visibleGridPaths);
  }
}

function patchListSlot(slot, entry) {
  if (entry.type === 'group') {
    slot._row.style.display = 'none';
    const g = slot._grp;
    g.style.display = '';
    g.dataset.gkey = entry.key;
    g.className = 'v-group' + (entry.collapsed ? ' collapsed' : '');
    slot._grpTitle.textContent = entry.title;
    slot._grpSub.textContent = entry.subtitle;
    slot._grpRight.textContent = entry.count + ' 项 · ' + formatBytes(entry.bytes);
    // Group checkbox state
    let selCnt = 0;
    for (let k = 0; k < entry.files.length; k++) if (selected.has(entry.files[k].path)) selCnt++;
    slot._grpChk.checked = selCnt > 0 && selCnt === entry.files.length;
    slot._grpChk.indeterminate = selCnt > 0 && selCnt < entry.files.length;
  } else {
    slot._grp.style.display = 'none';
    const it = entry.item;
    const r = slot._row;
    r.style.display = '';
    r.dataset.path = it.path;
    const isSel = selected.has(it.path);
    const isCur = current === it.path;
    r.className = 'v-row' + (state.viewMode === 'compact' ? ' compact' : '') + (entry.inHeaderGroup ? ' indented' : '') + (isSel ? ' selected' : '') + (isCur ? ' active' : '');

    slot._chk.checked = isSel;
    slot._ext.textContent = it.extLabel;
    slot._ext.title = it.category;

    if (activeQuery.highlightTerms.length) {
      slot._name.innerHTML = highlightText(it.name, activeQuery.highlightTerms);
    } else {
      slot._name.textContent = it.name;
    }
    slot._name.title = it.original;

    // Tags (Mark + Duplicates)
    let tagsHtml = '';
    const mk = marks[it.path];
    if (mk === '保留') tagsHtml += '<span class="tag-badge tag-keep">' + LOCK_SVG + '保留</span>';
    else if (mk === '待复核') tagsHtml += '<span class="tag-badge tag-review">待复核</span>';
    else if (mk === '待清理') tagsHtml += '<span class="tag-badge tag-purge">待清理</span>';
    if (it.duplicates > 1) tagsHtml += '<span class="tag-badge tag-dup">×' + it.duplicates + ' 重复</span>';
    slot._tags.innerHTML = tagsHtml;

    const dt = fmtDate(it.deletedTs, false);
    if (state.viewMode === 'compact') {
      slot._cdate.textContent = dt;
    } else {
      slot._sub.textContent = entry.inHeaderGroup
        ? (it.category + ' · ' + dt)
        : (it.category + ' · ' + dt + ' · ' + it.directory);
    }

    slot._sz.textContent = it.size;
    slot._sz.className = 'v-row-size-txt mono' + (it.bytes >= 50 * 1048576 ? ' large' : '');
    const pct = Math.max(4, Math.min(100, Math.round(Math.sqrt(it.bytes / maxResultBytes) * 100)));
    slot._bar.style.width = pct + '%';
  }
}

function renderGridRowSlot(slot, rowIdx, visiblePaths) {
  slot.style.gridTemplateColumns = 'repeat(' + gridCols + ', minmax(0, 1fr))';
  const start = rowIdx * gridCols;
  const end = Math.min(results.length, start + gridCols);
  const frag = document.createDocumentFragment();
  for (let i = start; i < end; i++) {
    const it = results[i];
    const card = document.createElement('div');
    card.className = 'g-card' + (selected.has(it.path) ? ' selected' : '') + (current === it.path ? ' active' : '');
    card.dataset.path = it.path;
    const catColor = CAT_COLORS[it.category] || '#64748b';
    const thumb = thumbCache.get(it.path);
    const isMedia = it.category === '图片' || it.category === '音频与视频';
    if (isMedia && thumb === undefined) visiblePaths.push(it.path);

    card.innerHTML =
      '<input type="checkbox" class="g-check row-chk"' + (selected.has(it.path) ? ' checked' : '') + '>'
      + '<div class="g-thumb">'
      + (thumb ? '<img src="' + thumb + '" alt="">' : '<span class="g-thumb-fallback" style="border-left:3px solid ' + catColor + '">' + esc(it.extLabel) + '</span>')
      + '<span class="g-size-tag">' + esc(it.size) + '</span>'
      + '</div>'
      + '<div class="g-body">'
      + '<div class="g-name" title="' + esc(it.original) + '">' + esc(it.name) + '</div>'
      + '<div class="g-sub">' + esc(fmtDate(it.deletedTs, false)) + (it.duplicates > 1 ? ' · ×' + it.duplicates : '') + '</div>'
      + '</div>';
    frag.appendChild(card);
  }
  slot.replaceChildren(frag);
}

function scheduleThumbFetch(paths) {
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(() => {
    const unique = [...new Set(paths)].slice(0, 32);
    if (unique.length) post({ cmd: 'thumbnails', paths: unique, reqId: ++thumbReqSeq });
  }, 90);
}

function scheduleRender() {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    renderVirtualWindow();
  });
}

viewport.addEventListener('scroll', scheduleRender, { passive: true });
new ResizeObserver(() => {
  if (results.length) {
    renderedKey = '';
    resetVirtualViewport(false);
  }
}).observe(viewport);

// ==================== EVENT DELEGATION ON VIEWPORT ====================
rowPoolEl.addEventListener('click', ev => {
  const grpChk = ev.target.closest('.grp-chk');
  if (grpChk) {
    ev.stopPropagation();
    const gkey = grpChk.closest('.v-group').dataset.gkey;
    const entry = entries.find(e => e.type === 'group' && e.key === gkey);
    if (entry) {
      for (const f of entry.files) {
        if (grpChk.checked) selected.add(f.path);
        else selected.delete(f.path);
      }
      updateSelectionUI();
      renderedKey = '';
      renderVirtualWindow();
    }
    return;
  }

  const grp = ev.target.closest('.v-group');
  if (grp) {
    const gkey = grp.dataset.gkey;
    if (collapsedGroups.has(gkey)) collapsedGroups.delete(gkey);
    else collapsedGroups.add(gkey);
    updateResults(false);
    return;
  }

  const rowEl = ev.target.closest('[data-path]');
  if (!rowEl) return;
  const path = rowEl.dataset.path;
  const chk = ev.target.closest('.row-chk');

  if (chk || ev.ctrlKey || ev.metaKey) {
    if (ev.shiftKey && lastClickedPath) {
      selectRange(lastClickedPath, path, true);
    } else {
      if (selected.has(path)) selected.delete(path);
      else selected.add(path);
    }
    lastClickedPath = path;
    updateSelectionUI();
    renderedKey = '';
    renderVirtualWindow();
    return;
  }

  if (ev.shiftKey && lastClickedPath) {
    selectRange(lastClickedPath, path, true);
    updateSelectionUI();
    renderedKey = '';
    renderVirtualWindow();
    return;
  }

  lastClickedPath = path;
  selectActiveItem(path);
});

rowPoolEl.addEventListener('contextmenu', ev => {
  const rowEl = ev.target.closest('[data-path]');
  if (!rowEl) return;
  ev.preventDefault();
  const path = rowEl.dataset.path;
  if (!selected.has(path)) selectActiveItem(path);
  openContextMenu(ev.clientX, ev.clientY, path);
});

function selectRange(fromPath, toPath, selectIt) {
  const a = resultIndexByPath.get(fromPath);
  const b = resultIndexByPath.get(toPath);
  if (a === undefined || b === undefined) return;
  const lo = Math.min(a, b), hi = Math.max(a, b);
  for (let i = lo; i <= hi; i++) {
    if (selectIt) selected.add(results[i].path);
    else selected.delete(results[i].path);
  }
}

function selectActiveItem(path) {
  if (current === path) return;
  current = path;
  const item = byPath.get(path);
  renderedKey = '';
  renderVirtualWindow();
  if (!item) return;
  previewOpts.tail = false;
  previewOpts.formatMode = 'raw';
  previewOpts.zoom = 'fit';
  previewOpts.find = '';
  renderInspectorShell(item);
  requestPreview(item.path, false);
}

function requestPreview(path, tail) {
  const reqId = ++previewReqSeq;
  if (bridge) {
    post({ cmd: 'preview', path, tail: !!tail, reqId });
  } else if (window._demoPreview) {
    setTimeout(() => handlePreviewMessage(window._demoPreview(path, tail, reqId)), 20);
  }
}

// ==================== INSPECTOR & RICH PREVIEW (F9, F10, F11, F4) ====================
function renderEmptyInspector() {
  $('insStickyFooter').hidden = true;
  $('inspectorScroll').innerHTML =
    '<div class="empty-state">'
    + '<svg class="ic" style="width:32px;height:32px;opacity:.45" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
    + '<strong>选择文件查看详情与预览</strong>'
    + '<span>支持代码高亮、日志尾部查看、图片缩放、视频封面与重复副本对比</span>'
    + '</div>';
}

function renderInspectorShell(item) {
  const catColor = CAT_COLORS[item.category] || '#64748b';
  const curMark = marks[item.path] || '未标记';
  const box = $('inspectorScroll');
  box.innerHTML =
    '<div class="ins-head">'
    + '<div class="ins-title-row"><h2 class="ins-title">' + esc(item.name) + '</h2></div>'
    + '<div class="ins-badges">'
    + '<span class="tag-badge" style="background:var(--bg-surface);border:1px solid var(--border);color:var(--ink-2)"><span class="legend-dot" style="background:' + catColor + '"></span>' + esc(item.category) + '</span>'
    + '<span class="mono">' + esc(item.size) + '</span>'
    + '<span>·</span><span>' + esc(fmtDate(item.deletedTs, true)) + '</span>'
    + '</div>'
    + '<div class="ins-quick-actions">'
    + '<button type="button" class="sm" id="insOpenDir">打开原目录</button>'
    + '<button type="button" class="sm" id="insCopyPath">复制原路径</button>'
    + '<button type="button" class="sm" id="insProps">属性</button>'
    + '</div>'
    + '</div>'
    + '<div id="insConflict"></div>'
    + '<div class="path-box"><div class="path-label">原路径</div>' + esc(item.original).replace(/\\/g, '\\<wbr>') + '</div>'
    + '<div id="insPreviewHost"><div class="preview-card"><div class="preview-plain" style="color:var(--ink-muted)">正在读取内容…</div></div></div>'
    + '<div id="insDupHost"></div>'
    + '<dl class="meta-grid" id="insMeta"></dl>';

  // Sticky footer for triage mark / retention lock — always visible without scrolling!
  const footer = $('insStickyFooter');
  footer.hidden = false;
  $('insMarks').innerHTML = ['未标记', '待复核', '保留', '待清理'].map(m => {
    const cls = m === curMark ? (m === '保留' ? 'active-keep' : m === '待复核' ? 'active-review' : m === '待清理' ? 'active-purge' : 'active-none') : '';
    return '<button type="button" class="mark-btn ' + cls + '" data-mark="' + m + '">' + (m === '保留' ? (LOCK_SVG + '保留') : m) + '</button>';
  }).join('');

  $('insOpenDir').onclick = () => post({ cmd: 'openLocation', paths: [item.path] });
  $('insCopyPath').onclick = () => {
    if (bridge) post({ cmd: 'copyPaths', text: item.original });
    else { navigator.clipboard?.writeText(item.original); showToast('success', '已复制原路径'); }
  };
  $('insProps').onclick = () => post({ cmd: 'showProperties', paths: [item.path] });

  $('insMarks').onclick = ev => {
    const b = ev.target.closest('[data-mark]');
    if (!b) return;
    const val = b.dataset.mark;
    if (val === '未标记') delete marks[item.path];
    else marks[item.path] = val;
    saveState();
    renderFacets();
    renderedKey = '';
    renderVirtualWindow();
    updateSelectionUI();
    renderInspectorShell(item);
    if (lastPreviewPayload && lastPreviewPayload.path === item.path) renderPreviewContent(item, lastPreviewPayload);
  };

  refreshInspectorDynamic(item);
  box.scrollTop = 0;
}

function refreshInspectorDynamic(item) {
  const dupHost = $('insDupHost');
  const metaHost = $('insMeta');
  if (!dupHost || !metaHost) return;

  // Duplicate siblings (F11)
  const siblings = isRealHash(item.hash) ? (byHash.get(item.hash) || []) : [];
  if (siblings.length > 1) {
    const box = document.createElement('div');
    box.className = 'dup-box';
    const head = document.createElement('div');
    head.className = 'dup-head';
    head.innerHTML = '<span>相同内容副本 (' + siblings.length + ' 份)</span>';
    const selOthers = document.createElement('button');
    selOthers.type = 'button'; selOthers.className = 'sm';
    selOthers.textContent = '勾选其余 ' + (siblings.length - 1) + ' 份';
    selOthers.onclick = () => {
      let added = 0;
      for (const s of siblings) {
        if (s.path !== item.path && marks[s.path] !== '保留') { selected.add(s.path); added++; }
      }
      updateSelectionUI();
      renderedKey = '';
      renderVirtualWindow();
      showToast('success', '已勾选其余 ' + added + ' 份重复副本');
    };
    head.appendChild(selOthers);
    box.appendChild(head);

    const list = document.createElement('div');
    list.className = 'dup-list';
    for (const s of siblings) {
      const row = document.createElement('div');
      row.className = 'dup-row' + (s.path === item.path ? ' current' : '');
      row.innerHTML = '<div class="dup-row-path" title="' + esc(s.original) + '">' + (s.path === item.path ? '● ' : '') + esc(s.original) + '</div>'
        + '<div class="dup-row-meta">' + esc(fmtDate(s.deletedTs, true)) + (marks[s.path] ? ' · ' + marks[s.path] : '') + '</div>';
      row.onclick = () => { if (s.path !== item.path) selectActiveItem(s.path); };
      list.appendChild(row);
    }
    box.appendChild(list);
    dupHost.replaceChildren(box);
  } else {
    dupHost.replaceChildren();
  }

  // Metadata grid
  const hashText = item.hash === null ? '后台校验中…'
    : item.hash === '~unique' ? '体积唯一（无重复）'
    : !item.hash ? '读取失败'
    : item.hash.slice(0, 16) + '… (' + (item.duplicates > 1 ? item.duplicates + ' 份相同' : '无重复') + ')';

  metaHost.innerHTML =
    '<dt>所属项目</dt><dd class="mono">' + esc(item.project) + '</dd>'
    + '<dt>删除时间</dt><dd class="mono">' + esc(fmtDate(item.deletedTs, true)) + '</dd>'
    + '<dt>修改时间</dt><dd class="mono">' + esc(fmtDate(item.modifiedTs, true)) + '</dd>'
    + '<dt>实际大小</dt><dd class="mono">' + esc(item.size) + ' (' + item.bytes.toLocaleString() + ' B)</dd>'
    + '<dt>内容校验</dt><dd class="mono">' + esc(hashText) + '</dd>';
}

function handlePreviewMessage(data) {
  if (!data || data.path !== current) return;
  lastPreviewPayload = data;
  const item = byPath.get(current);
  if (!item) return;

  const conflictBox = $('insConflict');
  if (conflictBox) {
    conflictBox.innerHTML = data.originalExists
      ? '<div class="conflict-banner"><svg class="ic sm" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><span>原路径存在同名文件，请用“恢复到指定目录”避免跳过</span></div>'
      : '';
  }
  renderPreviewContent(item, data);
}

function renderPreviewContent(item, data) {
  const host = $('insPreviewHost');
  if (!host) return;

  if (data.image) {
    const isVideo = data.mediaKind === 'video';
    const dims = data.imgW && data.imgH ? (data.imgW + ' × ' + data.imgH) : '';
    host.innerHTML =
      '<div class="preview-card">'
      + '<div class="preview-bar">'
      + '<div class="preview-bar-group"><span style="font-size:11px;color:var(--ink-muted)">' + (isVideo ? '视频封面帧' : '图片预览') + (dims ? ' · ' + dims : '') + '</span></div>'
      + '<div class="preview-bar-group">'
      + '<button type="button" class="sm ghost" id="imgFit">' + (previewOpts.zoom === 'fit' ? '1:1 原尺寸' : '适应窗口') + '</button>'
      + '<button type="button" class="sm ghost" id="imgChecker">棋盘底</button>'
      + '</div></div>'
      + '<div class="img-stage' + (previewOpts.checker ? ' checker' : '') + (previewOpts.zoom === 'actual' ? ' actual' : '') + '">'
      + '<img src="' + data.image + '" alt="预览">'
      + '</div></div>';

    $('imgFit').onclick = () => { previewOpts.zoom = previewOpts.zoom === 'fit' ? 'actual' : 'fit'; renderPreviewContent(item, data); };
    $('imgChecker').onclick = () => { previewOpts.checker = !previewOpts.checker; renderPreviewContent(item, data); };
    return;
  }

  if (data.mediaKind === 'text') {
    const ext = item.ext;
    const isJson = ext === 'json';
    const isCsv = ext === 'csv' || ext === 'tsv';
    const canTail = item.bytes > 131072;
    let rawText = data.data || '';
    if (isJson && previewOpts.formatMode === 'pretty') {
      try { rawText = JSON.stringify(JSON.parse(rawText), null, 2); } catch {}
    }

    host.innerHTML =
      '<div class="preview-card">'
      + '<div class="preview-bar">'
      + '<div class="preview-bar-group">'
      + '<button type="button" class="sm ' + (previewOpts.lineNums ? '' : 'ghost') + '" id="pvLines">行号</button>'
      + '<button type="button" class="sm ' + (previewOpts.wrap ? '' : 'ghost') + '" id="pvWrap">折行</button>'
      + (isJson ? '<button type="button" class="sm ' + (previewOpts.formatMode === 'pretty' ? '' : 'ghost') + '" id="pvJson">格式化</button>' : '')
      + (isCsv ? '<button type="button" class="sm ' + (previewOpts.formatMode === 'table' ? '' : 'ghost') + '" id="pvCsv">表格</button>' : '')
      + (canTail ? '<button type="button" class="sm ' + (previewOpts.tail ? '' : 'ghost') + '" id="pvTail">Tail尾部</button>' : '')
      + '</div>'
      + '<div class="preview-bar-group">'
      + '<button type="button" class="sm ghost" id="pvFindBtn" title="在预览内容中查找">查找</button>'
      + '<button type="button" class="sm ghost" id="pvCopyBtn">复制</button>'
      + '</div></div>'
      + '<div class="preview-find" id="pvFindBar"' + (previewOpts.find !== '' ? '' : ' hidden') + '>'
      + '<input type="text" id="pvFindInput" placeholder="在当前预览中查找…" value="' + esc(previewOpts.find) + '">'
      + '<span class="mono" id="pvFindCount" style="font-size:11px;color:var(--ink-muted)"></span>'
      + '</div>'
      + '<div class="preview-stage' + (previewOpts.wrap ? ' wrap' : '') + '" id="pvStage"></div>'
      + (data.truncated ? '<div style="padding:4px 10px;font-size:11px;color:var(--warn);background:var(--bg-surface);border-top:1px solid var(--border)">内容较大，已截断显示' + (data.tail ? '（当前为文件末尾 128KB）' : '（当前为前 256K 字符）') + '</div>' : '')
      + '</div>';

    const stage = $('pvStage');
    if (isCsv && previewOpts.formatMode === 'table') {
      stage.innerHTML = renderCsvTable(rawText, ext === 'tsv' ? '\t' : ',');
    } else {
      renderCodeIntoStage(stage, rawText, ext, previewOpts.find);
    }

    $('pvLines').onclick = () => { previewOpts.lineNums = !previewOpts.lineNums; renderPreviewContent(item, data); };
    $('pvWrap').onclick = () => { previewOpts.wrap = !previewOpts.wrap; renderPreviewContent(item, data); };
    if ($('pvJson')) $('pvJson').onclick = () => { previewOpts.formatMode = previewOpts.formatMode === 'pretty' ? 'raw' : 'pretty'; renderPreviewContent(item, data); };
    if ($('pvCsv')) $('pvCsv').onclick = () => { previewOpts.formatMode = previewOpts.formatMode === 'table' ? 'raw' : 'table'; renderPreviewContent(item, data); };
    if ($('pvTail')) $('pvTail').onclick = () => { previewOpts.tail = !previewOpts.tail; requestPreview(item.path, previewOpts.tail); };
    $('pvCopyBtn').onclick = () => {
      if (bridge) post({ cmd: 'copyPaths', text: rawText });
      else { navigator.clipboard?.writeText(rawText); showToast('success', '已复制预览内容'); }
    };
    $('pvFindBtn').onclick = () => {
      const bar = $('pvFindBar');
      bar.hidden = !bar.hidden;
      if (!bar.hidden) $('pvFindInput').focus();
      else { previewOpts.find = ''; renderPreviewContent(item, data); }
    };
    $('pvFindInput').oninput = e => {
      previewOpts.find = e.target.value;
      renderCodeIntoStage(stage, rawText, ext, previewOpts.find);
    };
    return;
  }

  host.innerHTML = '<div class="preview-card"><div class="preview-plain" style="color:var(--ink-muted)">' + esc(data.data || '暂无预览') + '</div></div>';
}

function renderCodeIntoStage(stage, text, ext, findStr) {
  const lines = text.split(/\r?\n/);
  const maxRenderLines = 1500;
  const limited = lines.length > maxRenderLines;
  const slice = limited ? lines.slice(0, maxRenderLines) : lines;
  let matchCount = 0;
  const fLower = (findStr || '').toLowerCase();

  const highlightLine = line => {
    if (fLower) {
      let idx = line.toLowerCase().indexOf(fLower);
      if (idx >= 0) {
        let out = '', pos = 0;
        while (idx >= 0) {
          matchCount++;
          out += esc(line.slice(pos, idx)) + '<mark class="hl">' + esc(line.slice(idx, idx + findStr.length)) + '</mark>';
          pos = idx + findStr.length;
          idx = line.toLowerCase().indexOf(fLower, pos);
        }
        return out + esc(line.slice(pos));
      }
      return esc(line);
    }
    return syntaxHighlightLine(line, ext);
  };

  if (previewOpts.lineNums) {
    let html = '<table class="code-table">';
    for (let i = 0; i < slice.length; i++) {
      html += '<tr><td class="ln">' + (i + 1) + '</td><td class="lc">' + highlightLine(slice[i]) + '</td></tr>';
    }
    if (limited) html += '<tr><td class="ln">…</td><td class="lc" style="color:var(--ink-muted)">[为保持流畅仅渲染前 1500 行，共 ' + lines.length + ' 行]</td></tr>';
    html += '</table>';
    stage.innerHTML = html;
  } else {
    stage.innerHTML = '<div class="preview-plain">' + slice.map(highlightLine).join('\n') + '</div>';
  }
  const cntEl = $('pvFindCount');
  if (cntEl) cntEl.textContent = fLower ? (matchCount + ' 处') : '';
}

const CODE_EXTS = new Set(['js','ts','jsx','tsx','py','cs','java','go','rs','cpp','c','h','ps1','sh','sql','css','html','yml','yaml','toml']);
const CODE_TOKEN_RE = /("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\/\/.*$|#.*$|\b(?:function|const|let|var|return|if|else|elif|for|while|in|class|import|from|export|async|await|def|lambda|try|catch|except|finally|public|private|static|void|string|int|bool|new|using|namespace|SELECT|FROM|WHERE|INSERT|UPDATE|DELETE|true|false|null|None|True|False|and|or|not|is)\b|\b\d+(?:\.\d+)?\b)/g;
const JSON_TOKEN_RE = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|\b(-?\d+(?:\.\d+)?)\b/g;

function syntaxHighlightLine(line, ext) {
  if (!line) return '';
  if (ext === 'json') {
    let out = '', last = 0, m;
    JSON_TOKEN_RE.lastIndex = 0;
    while ((m = JSON_TOKEN_RE.exec(line)) !== null) {
      if (m.index > last) out += esc(line.slice(last, m.index));
      if (m[1] !== undefined) {
        out += '<span class="' + (m[2] ? 'syn-key' : 'syn-str') + '">' + esc(m[1]) + '</span>' + (m[2] ? esc(m[2]) : '');
      } else if (m[3] !== undefined) {
        out += '<span class="syn-kw">' + esc(m[3]) + '</span>';
      } else if (m[4] !== undefined) {
        out += '<span class="syn-num">' + esc(m[4]) + '</span>';
      }
      last = JSON_TOKEN_RE.lastIndex;
    }
    return out + esc(line.slice(last));
  }
  if (!CODE_EXTS.has(ext)) return esc(line);

  let out = '', last = 0, m;
  CODE_TOKEN_RE.lastIndex = 0;
  while ((m = CODE_TOKEN_RE.exec(line)) !== null) {
    if (m.index > last) out += esc(line.slice(last, m.index));
    const tok = m[0];
    let cls = 'syn-kw';
    if (tok.startsWith('//') || tok.startsWith('#')) cls = 'syn-com';
    else if (tok.startsWith('"') || tok.startsWith("'")) cls = 'syn-str';
    else if (/^\d/.test(tok)) cls = 'syn-num';
    out += '<span class="' + cls + '">' + esc(tok) + '</span>';
    last = CODE_TOKEN_RE.lastIndex;
  }
  return out + esc(line.slice(last));
}

function renderCsvTable(text, delim) {
  const lines = text.split(/\r?\n/).filter(Boolean).slice(0, 120);
  if (!lines.length) return '<div class="preview-plain">空表格</div>';
  let html = '<table class="csv-table">';
  lines.forEach((ln, idx) => {
    const cells = ln.split(delim).slice(0, 20);
    const tag = idx === 0 ? 'th' : 'td';
    html += '<tr>' + cells.map(c => '<' + tag + '>' + esc(c.replace(/^"|"$/g, '')) + '</' + tag + '>').join('') + '</tr>';
  });
  html += '</table>';
  return html;
}

function applySmartPreset(preset) {
  const nowTicks = 621355968000000000 + Date.now() * 10000;
  const oldCutoff = nowTicks - 30 * 86400000 * 10000;
  let added = 0, skippedLocked = 0;

  if (preset === 'redundant') {
    for (const [h, group] of byHash) {
      if (group.length < 2) continue;
      // Keep the newest copy (or any marked '保留'); select the redundant ones
      const sorted = [...group].sort((a, b) => (marks[b.path] === '保留' ? 1 : 0) - (marks[a.path] === '保留' ? 1 : 0) || b.deletedTs - a.deletedTs || a.original.length - b.original.length);
      for (let i = 1; i < sorted.length; i++) {
        const it = sorted[i];
        if (marks[it.path] === '保留') { skippedLocked++; continue; }
        if (!selected.has(it.path)) { selected.add(it.path); added++; }
      }
    }
    if (!added && hashActive) {
      showToast('info', '重复内容仍在后台校验中，请稍候片刻再试');
      return;
    }
  } else {
    for (let i = 0; i < results.length; i++) {
      const it = results[i];
      let match = false;
      if (preset === 'cache') match = it.category === '缓存与临时文件' || it.category === '日志';
      else if (preset === 'large') match = it.bytes >= 50 * 1048576;
      else if (preset === 'old') match = it.deletedTs > 0 && it.deletedTs < oldCutoff;
      if (!match) continue;
      if (marks[it.path] === '保留') { skippedLocked++; continue; }
      if (!selected.has(it.path)) { selected.add(it.path); added++; }
    }
  }

  updateSelectionUI();
  renderedKey = '';
  renderVirtualWindow();
  showToast(added ? 'success' : 'info',
    added ? ('已智能勾选 ' + added + ' 项' + (skippedLocked ? '（自动跳过 ' + skippedLocked + ' 项保留锁定）' : ''))
      : '当前范围内未找到符合该预设的新增条目');
}

      saveState(); renderFacets(); renderedKey = ''; renderVirtualWindow(); updateSelectionUI();

    { label: multi ? '永久删除选中的 ' + paths.length + ' 项…' : '永久删除…', danger: true, fn: () => confirmDelete(paths) }

  const frag = document.createDocumentFragment();
  for (const entry of items) {
    if (entry.sep) { const s = document.createElement('div'); s.className = 'ctx-sep'; frag.appendChild(s); continue; }
    const b = document.createElement('button');
    b.type = 'button';

    b.textContent = entry.label;

    frag.appendChild(b);
  }
  menu.replaceChildren(frag);
  menu.hidden = false;
  const rect = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, window.innerWidth - rect.width - 8) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - rect.height - 8) + 'px';
}

function exportCurrentReport(ext) {
  let content = '';
  if (ext === 'json') {
    content = JSON.stringify(results.map(it => ({
      name: it.name, original: it.original, category: it.category,
      bytes: it.bytes, size: it.size, deleted: fmtDate(it.deletedTs, true),
      duplicates: it.duplicates, mark: marks[it.path] || ''
    })), null, 2);
  } else {
    const csvEsc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = ['文件名,类别,大小(字节),可读大小,删除时间,重复数,标记,原路径'];
    for (const it of results) {
      rows.push([it.name, it.category, it.bytes, it.size, fmtDate(it.deletedTs, true), it.duplicates, marks[it.path] || '', it.original].map(csvEsc).join(','));
    }
    content = rows.join('\r\n');
  }
  const stamp = new Date().toISOString().slice(0, 10);
  const fname = 'recycle-bin-report-' + stamp + '.' + ext;
  if (bridge) {
    post({ cmd: 'exportReport', text: content, defaultName: fname, ext });

// ==================== RESIZABLE SPLITTERS (F14) ====================
function setupResizer(el, prop, minW, maxW, isRight) {
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    el.classList.add('dragging');
    const startX = e.clientX;
    const startW = isRight ? state.rightW : state.leftW;
    const onMove = mv => {
      const dx = mv.clientX - startX;
      const next = Math.max(minW, Math.min(maxW, isRight ? startW - dx : startW + dx));
      if (isRight) state.rightW = next; else state.leftW = next;
      $('workspace').style.setProperty(prop, next + 'px');
    };
    const onUp = () => {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      saveState();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// Keyboard navigation & shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdPalette(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); $('search').focus(); $('search').select(); return; }
  if (e.key === 'F5') { e.preventDefault(); post({ cmd: 'refresh' }); return; }
  if (e.key === 'Escape') {
    if (!$('tourLayer').hidden) { finishTour(true); return; }
    if (!$('cmdBackdrop').hidden) { closeCmdPalette(); return; }
    if (!$('modalBackdrop').hidden) { closeModal(); return; }
    if (!$('logDrawer').hidden) { toggleLogDrawer(false); return; }
    if (!$('ctxMenu').hidden) { $('ctxMenu').hidden = true; return; }
    if (selected.size) { selected.clear(); updateSelectionUI(); renderedKey = ''; renderVirtualWindow(); }
    return;
  }
  if (!$('tourLayer').hidden) {
    if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); nextTourStep(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevTourStep(); }
    return;
  }

  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
    e.preventDefault();
    for (const it of results) selected.add(it.path);
    updateSelectionUI(); renderedKey = ''; renderVirtualWindow();
    return;
  }
  if (e.key === 'Delete' && selected.size && !busyScan && !busyAction) {
    e.preventDefault();
    confirmDelete([...selected]);
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!results.length) return;
    e.preventDefault();
    const curIdx = current ? (resultIndexByPath.get(current) ?? -1) : -1;
    const nextIdx = e.key === 'ArrowDown'
      ? Math.min(results.length - 1, curIdx + 1)
      : Math.max(0, curIdx - 1);
    selectActiveItem(results[nextIdx].path);
    scrollItemIntoView(results[nextIdx].path);
    return;
  }
  if (e.key === ' ' && current) {
    e.preventDefault();
    if (selected.has(current)) selected.delete(current);
    else selected.add(current);
    updateSelectionUI(); renderedKey = ''; renderVirtualWindow();
  }
});

function scrollItemIntoView(path) {
  let rowIdx = -1;
  if (state.viewMode === 'grid') {
    const i = resultIndexByPath.get(path);
    if (i !== undefined) rowIdx = Math.floor(i / gridCols);
  } else {
    rowIdx = entries.findIndex(e => e.type === 'item' && e.item.path === path);
  }
  if (rowIdx < 0) return;
  const top = rowIdx * rowHeight;
  const bottom = top + rowHeight;
  if (top < viewport.scrollTop) viewport.scrollTop = top;
  else if (bottom > viewport.scrollTop + viewport.clientHeight) viewport.scrollTop = bottom - viewport.clientHeight;
}

if (bridge) {
  let chunkBuffer = [];
  bridge.addEventListener('message', ({ data }) => {
    if (!data || !data.type) return;

    if (data.type === 'state') {
      try {
        const s = JSON.parse(data.data);
        marks = s.marks || {};
        roots = s.roots || [];
        if (s.theme) applyTheme(s.theme, true);

        if (s.rightW) { state.rightW = s.rightW; $('workspace').style.setProperty('--right-w', s.rightW + 'px'); }
        state.onboardingDone = !!s.onboardingDone;
        syncSortControls();
        if (hasScanned) rebuildIndexes(false);
        if (!state.onboardingDone) setTimeout(() => startTour(0), 260);
      } catch {}
    } else if (data.type === 'itemsChunk') {
      hasScanned = true;
      if (data.first) {
        chunkBuffer = data.items || [];
        rawItems = chunkBuffer;
        if (data.last) {
          scanErrors = data.errors || [];
          if (scanErrors.length) $('logBtn').classList.add('badge-dot');
        }
        rebuildIndexes(true);
      } else {
        const incoming = data.items || [];
        for (let i = 0; i < incoming.length; i++) chunkBuffer.push(incoming[i]);
        rawItems = chunkBuffer;
        if (data.last) {
          scanErrors = data.errors || [];
          if (scanErrors.length) $('logBtn').classList.add('badge-dot');
          rebuildIndexes(false);
        } else {
          $('heroSub').textContent = '已加载 ' + chunkBuffer.length.toLocaleString() + ' / ' + (data.total || chunkBuffer.length).toLocaleString() + ' 项…';
        }
      }
    } else if (data.type === 'hashes') {
      const map = data.hashes || {};
      for (let i = 0; i < rawItems.length; i++) {
        const h = map[rawItems[i].path];
        if (h !== undefined) rawItems[i].hash = h;
      }
      if (data.errors) scanErrors = data.errors;
      if (data.done) {
        hashActive = false;
        updateStatusPill();
        rebuildIndexes(false);
      } else {
        hashActive = true;
        $('bgStatusText').textContent = '重复校验 ' + (data.percent || 0) + '%';
        updateStatusPill();
      }
    } else if (data.type === 'hashProgress') {
      hashActive = !!data.active;
      if (hashActive) $('bgStatusText').textContent = '重复校验 ' + (data.percent || 0) + '%';
      updateStatusPill();
    } else if (data.type === 'workStatus') {
      if (data.phase === 'action') {
        busyAction = !!data.busy;
        if (busyAction && data.message) $('bgStatusText').textContent = data.message;
      } else {
        busyScan = !!data.busy;
        if (busyScan && data.message) $('bgStatusText').textContent = data.message;
        if (!busyScan && data.message) showToast('error', data.message);
      }
      updateStatusPill();
      updateSelectionUI();
    } else if (data.type === 'actionResult') {
      showToast(data.failures && data.failures.length ? 'warn' : 'success', data.message);
      if (data.failures && data.failures.length) {
        addLog('error', '失败详情：\n' + data.failures.join('\n'));
      }
      if (data.removed && data.removed.length) {
        const rem = new Set(data.removed);
        rawItems = rawItems.filter(it => !rem.has(it.path));
        for (const p of data.removed) selected.delete(p);
        rebuildIndexes(false);
      }
    } else if (data.type === 'binEmptied') {
      rawItems = [];
      selected.clear();
      current = '';
      rebuildIndexes(true);
      renderEmptyInspector();
      showToast('success', data.message);
    } else if (data.type === 'preview') {
      handlePreviewMessage(data);
    } else if (data.type === 'thumbnails') {
      const m = data.map || {};
      let updated = false;
      for (const k in m) {
        if (Object.hasOwn(m, k)) { thumbCache.set(k, m[k]); updated = true; }
      }
      if (updated && state.viewMode === 'grid') { renderedKey = ''; renderVirtualWindow(); }
    } else if (data.type === 'pickedFolder' && data.path) {
      addProjectRoot(data.path);
    } else if (data.type === 'toast') {
      showToast(data.level || 'info', data.message || '');
    }
  });
}

// ==================== HELPERS ====================
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function highlightText(text, terms) {
  if (!terms.length) return esc(text);
  const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  try {
    const re = new RegExp('(' + pattern + ')', 'gi');
    return text.split(re).map((part, idx) => idx % 2 === 1 ? '<mark class="hl">' + esc(part) + '</mark>' : esc(part)).join('');
  } catch { return esc(text); }
}

      + '<li><strong>交互式空间占比条</strong>：可切换「按类别 / 按项目」，<strong>点击任意色块</strong>立即下钻筛选对应大头文件。</li>'
      + '<li><strong>右侧「一键圈选」</strong>：直接勾选缓存/日志、超大文件 &gt;50MB、30天前旧文件或重复文件中的多余副本（自动保留最新一份，并避开保留锁）。</li>'
      + '</ul>'
  },
  {
    target: '.search-wrap',
    title: '高级搜索语法与 Ctrl+K 命令面板',
    body: '<p>搜索框支持多关键词空格组合及快捷语法（点击下方示例可直接试填）：</p>'
      + '<div class="tour-syntax-grid">'
      + '<button type="button" class="tour-syntax-chip" data-try="*.log"><code>*.log</code><span>通配符后缀</span></button>'
      + '<button type="button" class="tour-syntax-chip" data-try=">50mb"><code>&gt;50mb</code><span>体积过滤</span></button>'
      + '<button type="button" class="tour-syntax-chip" data-try="ext:py"><code>ext:py</code><span>精准扩展名</span></button>'
      + '<button type="button" class="tour-syntax-chip" data-try="drive:d"><code>drive:d</code><span>按盘符筛选</span></button>'
      + '</div>'
      + '<p>随时按下 <strong class="mono">Ctrl+K</strong> 呼出快捷命令面板，一键切换主题、视图、排序、导出清单或执行清理预设。</p>'
  },
  {
    target: '.rail',
    title: '智能分面筛选与项目目录归类',
    body: '<ul class="tour-list">'
      + '<li><strong>智能视图</strong>：一键切入重复内容、大文件、缓存与日志，或按你的标记状态（保留 / 待复核 / 待清理）复查。</li>'
      + '<li><strong>项目目录管理</strong>：点击「+ 添加目录」或采纳下方高频目录建议，把零散回收站文件自动归类到对应代码仓库。</li>'
      + '<li><strong>大文件量零卡顿</strong>：列表与左侧目录均采用虚拟化/限流渲染，数万文件也能流畅检索。</li>'
      + '</ul>'
  },
  {
    target: '.inspector',
    title: '富媒体检视台与「保留」防误删锁',
    body: '<ul class="tour-list">'
      + '<li><strong>安全预览</strong>：支持代码高亮/行号/折行/查找、大日志 <strong>Tail 尾部</strong>查看、JSON 格式化、CSV 表格、图片缩放与视频封面帧。</li>'
      + '<li><strong>重复副本直达</strong>：同 SHA-256 副本会汇总显示，一键勾选其余重复项。</li>'
      + '<li><strong>底部「保留」锁</strong>：标为保留的文件自带绿色加锁，永久删除弹窗默认自动跳过，防止误删重要代码。</li>'
      + '</ul>'
  },
  {
    target: '.dock',
    title: '批量安全处置与快捷键速查',
    body: '<p>底部操作坞实时统计已选数量与预计释放空间，支持<strong>恢复到原位置</strong>、<strong>恢复到指定目录</strong>（可选冲突策略）、<strong>复制导出</strong>、<strong>永久删除</strong>及右键菜单联动系统资源管理器。</p>'
      + '<div class="tour-kbd-grid">'
      + '<div class="tour-kbd-row"><span>命令面板</span><kbd>Ctrl+K</kbd></div>'
      + '<div class="tour-kbd-row"><span>聚焦搜索</span><kbd>Ctrl+F</kbd></div>'
      + '<div class="tour-kbd-row"><span>切换预览</span><kbd>↑ / ↓</kbd></div>'
      + '<div class="tour-kbd-row"><span>勾选当前项</span><kbd>Space</kbd></div>'
      + '<div class="tour-kbd-row"><span>连续多选</span><kbd>Shift+点击</kbd></div>'
      + '<div class="tour-kbd-row"><span>全选结果</span><kbd>Ctrl+A</kbd></div>'
      + '<div class="tour-kbd-row"><span>永久删除</span><kbd>Delete</kbd></div>'
      + '<div class="tour-kbd-row"><span>重新扫描</span><kbd>F5</kbd></div>'
      + '</div>'
  }
];
let tourIdx = 0;

function startTour(idx) {
  tourIdx = Math.max(0, Math.min(TOUR_STEPS.length - 1, idx || 0));
  $('tourLayer').hidden = false;
  renderTourStep();
}
function nextTourStep() {
  if (tourIdx >= TOUR_STEPS.length - 1) finishTour(false);
  else { tourIdx++; renderTourStep(); }
}
function prevTourStep() {
  if (tourIdx > 0) { tourIdx--; renderTourStep(); }
}
function finishTour(skipped) {
  $('tourLayer').hidden = true;
  if (!state.onboardingDone) {
    state.onboardingDone = true;
    saveState();
  }
  showToast('info', skipped ? '已跳过引导，随时可点击右上角 ? 或按 Ctrl+K 再次查看' : '引导完成，随时可点击右上角 ? 按钮重温快捷键');
}
function renderTourStep() {
  const step = TOUR_STEPS[tourIdx];
  $('tourStepBadge').textContent = (tourIdx + 1) + ' / ' + TOUR_STEPS.length;
  $('tourTitle').textContent = step.title;
  $('tourBody').innerHTML = step.body;
  $('tourPrev').disabled = tourIdx === 0;
  $('tourNext').textContent = tourIdx === TOUR_STEPS.length - 1 ? '开始使用' : '下一步';

  const dotsFrag = document.createDocumentFragment();
  for (let i = 0; i < TOUR_STEPS.length; i++) {
    const d = document.createElement('span');
    d.className = 'tour-dot' + (i === tourIdx ? ' active' : '');
    dotsFrag.appendChild(d);
  }
  $('tourDots').replaceChildren(dotsFrag);

  $('tourBody').querySelectorAll('[data-try]').forEach(btn => {
    btn.onclick = () => {
      $('search').value = btn.dataset.try;
      if (hasScanned) updateResults(true);
      showToast('info', '已填入示例搜索语法：' + btn.dataset.try);
    };
  });

  positionTourCard(step.target);
}
function positionTourCard(selector) {
  const spot = $('tourSpot');
  const card = $('tourCard');
  const el = document.querySelector(selector);
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = 4;
  if (!el || el.offsetWidth === 0) {
    spot.style.display = 'none';
    card.style.left = Math.round((vw - card.offsetWidth) / 2) + 'px';
    card.style.top = Math.round((vh - card.offsetHeight) / 2) + 'px';
    return;
  }
  const r = el.getBoundingClientRect();
  spot.style.display = '';
  spot.style.left = Math.max(2, r.left - pad) + 'px';
  spot.style.top = Math.max(2, r.top - pad) + 'px';
  spot.style.width = Math.min(vw - 4, r.width + pad * 2) + 'px';
  spot.style.height = Math.min(vh - 4, r.height + pad * 2) + 'px';

  const cw = card.offsetWidth || 440;
  const ch = card.offsetHeight || 260;
  const gap = 14;
  let left = r.left;
  let top = r.bottom + gap;

  if (selector === '.rail') {
    left = r.right + gap;
    top = Math.max(70, r.top + 30);
  } else if (selector === '.inspector') {
    left = r.left - cw - gap;
    top = Math.max(70, r.top + 30);
  } else if (selector === '.dock') {
    left = Math.round((vw - cw) / 2);
    top = r.top - ch - gap;
  } else if (selector === '.search-wrap') {
    left = Math.round(r.left + (r.width - cw) / 2);
    top = r.bottom + gap;
  } else {
    left = Math.round((vw - cw) / 2);
    top = r.bottom + gap;
  }

  left = Math.max(14, Math.min(vw - cw - 14, left));
  top = Math.max(14, Math.min(vh - ch - 14, top));
  card.style.left = left + 'px';
  card.style.top = top + 'px';
}
$('tourPrev').onclick = prevTourStep;
$('tourNext').onclick = nextTourStep;
$('tourSkipTop').onclick = () => finishTour(true);
window.addEventListener('resize', () => {
  if (!$('tourLayer').hidden) positionTourCard(TOUR_STEPS[tourIdx].target);
});

// ==================== INIT ====================
syncSortControls();
if (bridge) {
  post({ cmd: 'ready' });
} else if (new URLSearchParams(location.search).get('demo') === '1') {
  bootDemoMode();
  const tourStep = new URLSearchParams(location.search).get('tour');
  if (tourStep !== null) startTour(Math.max(0, Number(tourStep) - 1));
}
</script>
</body>
</html>
