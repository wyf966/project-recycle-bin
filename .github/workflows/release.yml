name: Release & Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write
  packages: write

jobs:
  release-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build MSI installer
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\app\package.ps1
          $msi = Get-ChildItem .\release\*.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "No MSI produced" }
          "MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSI_NAME=$($msi.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } elseif ('${{ inputs.tag }}') { '${{ inputs.tag }}' } else { 'v0.2.0' }
          $ver = $tag.TrimStart('v')
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Built $($msi.Name) ($($msi.Length) bytes) for $tag (pkg $ver)"

      - name: Ensure GitHub Release has MSI asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $env:MSI_PATH --title "$tag" --notes-file CHANGELOG.md
          } else {
            gh release upload $tag $env:MSI_PATH --clobber
          }

      - name: Pack MSI into GitHub Packages (NuGet)
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "nupkg-out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $owner = "${{ github.repository_owner }}"
          $repoUrl = "https://github.com/${{ github.repository }}"
          dotnet pack .\app\installer\InstallerPackage.csproj -c Release -o $outDir `
            -p:PackageVersion=$env:PKG_VERSION `
            -p:RepoOwner=$owner `
            -p:RepoUrl=$repoUrl `
            -p:MsiPath=$env:MSI_PATH `
            -p:MsiName=$env:MSI_NAME
          $nupkg = Get-ChildItem $outDir -Filter "*.nupkg" | Select-Object -First 1
          if (-not $nupkg) { throw "No nupkg produced" }
          "NUPKG_PATH=$($nupkg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Packed $($nupkg.Name) ($($nupkg.Length) bytes)"

      - name: Push installer package to GitHub Packages
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}"
          dotnet nuget add source "https://nuget.pkg.github.com/$owner/index.json" --name github --username $owner --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
          dotnet nuget push $env:NUPKG_PATH --source github --skip-duplicate
